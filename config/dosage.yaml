# config/dosage.yaml
# Dosage frequency recommender — all tunable parameters in one place.
#
# label_map: maps the cleaned_data.xlsx 'frequency' string values to integer class labels.
# label_names: human-readable names indexed by integer label (label_names[0] = label_map key 0).
# intake_features_raw: column names from cleaned_data.xlsx before encoding.
# intake_features_encoded: column names after one-hot/binary encoding — these are the model input.
# future_features: fields not yet collected but planned; add to intake_features_* once available.
# categorical_features: subset of intake_features_raw that require binary encoding.

label_map:
  "once": 0
  "twice": 1
  # "l + r 10" is the exact string that appears in cleaned_data.xlsx after .strip().lower()
  # normalization — spaces and trailing number are intentional. The asymmetry with
  # label_names[2] = "lr10" is deliberate: label_map keys must match raw data verbatim,
  # while label_names uses compact slugs for code use (array indexing, reports, etc.).
  "l + r 10": 2

label_names:
  - once
  - twice
  - lr10

intake_features_raw:
  - Age
  - Gender
  - Joined_with_pain
  - knee_issue
  - leg_issue
  - back_spine_issue
  - balance_issue
  - upper_body_issue
  - foot_ankle_issue
  - neuro_issue
  - frailty_issue
  - metabolic_issue
  - injury_surgery_issue
  - general_pain_issue

intake_features_encoded:
  # Base intake features
  - age
  - gender_M
  - joined_with_pain_Y
  - hl_knee_issue
  - hl_leg_issue
  - hl_back_spine_issue
  - hl_balance_issue
  - hl_upper_body_issue
  - hl_foot_ankle_issue
  - hl_neuro_issue
  - hl_frailty_issue
  - hl_metabolic_issue
  - hl_injury_surgery_issue
  - hl_general_pain_issue
  # Clinically-engineered composite features (derived from base features at runtime)
  # age_above_65 / age_above_75: Venugobal 2023 (Aging) shows 66-75 and 76-91 age cohorts
  #   are the strongest responders to once-weekly PEMF; age stratification predicts response.
  - age_above_65
  - age_above_75
  # bilateral_lower_limb_load: sum of bilateral lower-limb condition flags (0-4).
  #   Wang 2024 (Front Med) found bilateral knee OA requires bilateral (L+R) treatment.
  - bilateral_lower_limb_load
  # inflammatory_burden: count of inflammatory condition flags (0-4).
  #   Franco-Obregón 2023 (Biocell): once-weekly PEMF resets systemic inflammatory milieu
  #   via muscle secretome; multi-inflammatory patients benefit most from once/week.
  - inflammatory_burden
  # elderly_frailty: age_above_65 × hl_frailty_issue interaction.
  #   Venugobal 2023: frail elderly (65+) are the HIGHEST responders to once-weekly PEMF
  #   (responder rate increases post-65); distinguishes elderly frailty from younger patients.
  - elderly_frailty
  # muscle_atrophy_risk: age_above_65 × (frailty + neuro + leg) composite (0-3).
  #   Kurth 2020 (Adv Biosystems): TRPC1 expression predicts PEMF sensitivity; frail+neuro
  #   patients in older cohorts have reduced TRPC1 but more room for improvement.
  - muscle_atrophy_risk
  # pain_with_knee: hl_knee_issue × joined_with_pain_Y interaction.
  #   Wang 2024: patients with both active knee OA and pain at intake showed bilateral
  #   treatment superiority; interaction term separates lr10 from twice.
  - pain_with_knee

future_features:
  # Collect these at intake to address the external-activity confounder.
  # Once present in cleaned_data.xlsx, add to intake_features_raw/encoded above
  # and re-run make dosage — no code changes required.
  - activity_level          # sedentary / light_active / moderately_active / very_active
  - exercise_freq_per_week  # 0 / 1-2 / 3-4 / 5+
  - pain_duration_months    # float
  - prior_physio            # Y / N

model:
  n_estimators: 400
  learning_rate: 0.03
  max_depth: 3
  min_samples_leaf: 6
  random_state: 42

calibration:
  method: sigmoid   # Platt scaling
  cv: 5

# Training / evaluation cross-validation loop — distinct from calibration.cv above,
# which controls folds only for Platt scaling (CalibratedClassifierCV).
cv:
  k: 5

model_path: "models/dosage_frequency.joblib"
