regression_composite:
  features:
    # baseline demographics & measurements (original 16)
    - age
    - gender
    - baseline_sppb
    - pre_normal_gs_ms
    - pre_tug_s
    - pre_5xsst_s
    - usage_frequency
    - cohort
    - has_oa
    - has_diabetes
    - has_stroke
    - has_parkinsons
    - has_sarcopenia
    - has_post_surgery
    - has_balance_issue
    - has_chronic_pain
    # additional baseline scores
    - pre_vas
    - pre_fast_gs_ms
    # condition complexity
    - n_flags
    - n_regions
    - n_groups
    # additional comorbidity flags
    - has_hypertension
    - has_frailty
    - has_fall_risk
    - has_neurological
    - has_metabolic
    - has_knee_issue
    - has_spinal_issue
    # clinical group flags
    - grp_joint_disease
    - grp_spine_back
    - grp_neurological
    - grp_post_surgical
    - grp_frailty_sarcopenia
    - grp_balance_falls
    - grp_metabolic
    - grp_softtissue_injury
    - grp_osteoporosis
    # body region flags
    - rgn_spine
    - rgn_knee
    - rgn_ankle_foot
    - rgn_hip
    - rgn_lower_limb
    - rgn_shoulder
    - rgn_upper_limb
    - rgn_trunk
    # categorical
    - primary_indication
  target: composite_improvement
  model: gradient_boosting
  cv:
    kind: stratified_kfold
    k: 5
    stratify_on: cohort
  metrics: [rmse, mae, r2]

classifier_responder:
  target: overall_responder
  features:
    # baseline demographics & measurements (original 16)
    - age
    - gender
    - baseline_sppb
    - pre_normal_gs_ms
    - pre_tug_s
    - pre_5xsst_s
    - usage_frequency
    - cohort
    - has_oa
    - has_diabetes
    - has_stroke
    - has_parkinsons
    - has_sarcopenia
    - has_post_surgery
    - has_balance_issue
    - has_chronic_pain
    # additional baseline scores
    - pre_vas
    - pre_fast_gs_ms
    # condition complexity
    - n_flags
    - n_regions
    - n_groups
    # additional comorbidity flags
    - has_hypertension
    - has_frailty
    - has_fall_risk
    - has_neurological
    - has_metabolic
    - has_knee_issue
    - has_spinal_issue
    # clinical group flags
    - grp_joint_disease
    - grp_spine_back
    - grp_neurological
    - grp_post_surgical
    - grp_frailty_sarcopenia
    - grp_balance_falls
    - grp_metabolic
    - grp_softtissue_injury
    - grp_osteoporosis
    # body region flags
    - rgn_spine
    - rgn_knee
    - rgn_ankle_foot
    - rgn_hip
    - rgn_lower_limb
    - rgn_shoulder
    - rgn_upper_limb
    - rgn_trunk
    # categorical
    - primary_indication
  model: gradient_boosting
  metrics: [auc_roc, auc_pr, brier, f1, calibration_curve]

