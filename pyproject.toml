[tool.poetry]
name = "qtx"
version = "0.1.0"
description = "QuantumTX AH patient outcomes ML pipeline"
authors = []
packages = [{include = "qtx", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pandas = "^2.2"
numpy = "^1.26"
pyarrow = "^15.0"
openpyxl = "^3.1"
pyyaml = "^6.0"
scikit-learn = "^1.4"
statsmodels = "^0.14"
miceforest = "^5.0"
shap = "^0.44"
plotly = "^5.20"
matplotlib = "^3.8"
streamlit = "^1.32"
rich = "^13.7"
pydantic = "^2.6"
pandera = "^0.18"
jinja2 = "^3.1"
xgboost = "^2.0"
sqlalchemy = "^2.0"
httpx = "^0.27"

[tool.poetry.dev-dependencies]
pytest = "^8.0"
hypothesis = "^6.100"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
